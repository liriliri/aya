import com.android.build.api.artifact.SingleArtifact

plugins {
    id 'com.android.application'
    id 'com.google.protobuf'
}

dependencies {
    implementation 'com.google.protobuf:protobuf-java:3.22.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}

android {
    namespace 'io.liriliri.aya'

    compileSdk = 36

    buildFeatures {
        buildConfig = true
    }

    def pkgFilePath = "$rootDir/../package.json"
    def pkgFile = new File(pkgFilePath)
    def pkgJson = new groovy.json.JsonSlurper().parseText(pkgFile.text)

    defaultConfig {
        minSdk 23
        versionCode 1
        versionName pkgJson.version
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("aya-server-v${output.versionName.get()}.apk")
        }

        def apkDirectory = variant.artifacts.get(SingleArtifact.APK.INSTANCE)
        def extractDex = tasks.register("extract${variant.name.capitalize()}Dex") {
            inputs.dir(apkDirectory)
            outputs.file(rootProject.file('aya.dex'))

            doLast {
                def apk = fileTree(apkDirectory.get().asFile) { include '*.apk' }.singleFile
                copy {
                    from zipTree(apk).matching { include 'classes.dex' }
                    into rootProject.rootDir
                    rename { 'aya.dex' }
                }
            }
        }

        tasks.configureEach {
            if (name == "assemble${variant.name.capitalize()}") {
                finalizedBy(extractDex)
            }
        }
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.22.3'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {}
            }
        }
    }
}
